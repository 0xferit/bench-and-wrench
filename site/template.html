<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="{{theme_paper}}" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="{{theme_paper_dark}}" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="{{page_title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="website">
  <title>{{page_title}}</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/archivo-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/geist-mono-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to the content</a>
  <div class="sheet" id="top">
    <header class="masthead">
      <a class="brand" href="{{home}}#top" aria-label="{{title}} home">
        <img class="brand-mark" src="assets/mark.svg" width="28" height="28" alt="">
        <span class="brand-name">{{title}}</span>
      </a>
      <nav class="masthead-nav" aria-label="Main navigation"><a href="{{home}}#tools">Tools</a><a href="{{home}}#approach">Approach</a><a href="design-system.html">Design system</a><a class="nav-accent" href="{{profile_url}}">GitHub</a></nav>
    </header>
    <main id="main">
      {{main}}
    </main>
    <footer class="site-footer cell-row">
      <div class="cell"><p><strong>{{title}}</strong>. Software tools, with the thinking left in.</p></div>
      <div class="cell"><a class="label" href="#top">Back to the top</a></div>
    </footer>
  </div>
</body>
</html>
